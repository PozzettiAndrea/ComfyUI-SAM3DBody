python = "3.11"

[cuda]
packages = ["detectron2", "torch-scatter", "torch-sparse", "torch-cluster", "flash-attn", "sageattention"]

[dependencies]
numpy = "<2.0"

[target.linux-64.dependencies]
xorg-libsm = "*"     # libSM.so.6 required by bpy

[pypi-dependencies]
bpy = ">=4.2"
trimesh = { version = "*", extras = ["easy"] }
pillow = ">=9.0.0"
opencv-python-headless = ">=4.8.0"
huggingface-hub = ">=0.16.0"
transformers = ">=4.30.0"
einops = ">=0.6.0"
timm = ">=0.9.0"
roma = ">=1.3.0"
psutil = "*"
av = "*"
comfy-aimdo = "*"