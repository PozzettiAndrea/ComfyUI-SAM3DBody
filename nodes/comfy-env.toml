[workspace]
channels = ["conda-forge", "pozzettiandrea"]

[dependencies]
bpy = {version = "*", channel = "pozzettiandrea"}
av = "*"

[target.linux-64.dependencies]
xorg-libsm = "*"     # libSM.so.6 required by bpy

[cuda]
packages = ["detectron2", "torch-scatter", "torch-sparse", "torch-cluster", "flash-attn", "sageattention"]

[pypi-dependencies]
trimesh = { version = "*", extras = ["easy"] }
pillow = ">=9.0.0"
opencv-python-headless = ">=4.8.0"
huggingface-hub = ">=0.16.0"
transformers = "*"
einops = ">=0.6.0"
timm = ">=0.9.0"
roma = ">=1.3.0"
psutil = "*"
av = "*"
comfy-aimdo = "*"
